[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:langsmith_plugin
markers =
    unit: Fast unit tests
    integration: Multi-module integration tests
    leakage: Backtest and feature leakage prevention tests
    risk: Risk engine safety and rejection tests
    budget: LLM cost and call counter tests
